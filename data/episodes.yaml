# 配信エピソード一覧 — このファイルが SoT、build.py が docs/index.html を生成する。
#
# schema (1 entry = 配信 1 話):
#   number:      配信通し番号 (int) ⚠️ field 名を no にしない (= PyYAML が bool False に解釈する罠)
#   title:       エピソードタイトル
#   date:        配信日 YYYY-MM-DD
#   description: 紹介文 (サイト表示用。所有者の文体運用に従って書く)
#   links:       配信先 URL (key = listen / spotify / apple / amazon / youtube、無いものは省略)
#   references:  この回に出てきたもの (list of {label, url})。話題にした番組・作品・
#                研究会・講演などへのリンク。Amazon は tracking param なしの /dp/ASIN 形
#
# episodes は新しい順に表示される (build.py が number 降順 sort)。
#
# show_links: 各配信先の「番組ページ」URL (key は上と同じ)。空の配信先は
# サイトに「準備中」と表示され、URL を入れると自動でリンクに変わる。

show_links:
  listen: "https://listen.style/p/space-rock-diner"

episodes:
  - number: 1
    title: "第1回 石は銀河を二十周した（2026.8.17 収録 1/3）"
    date: 2026-09-21
    description: "何十億年も黙っていた石が、いちばん気の長い検出器だった。好きなポッドキャストの話、オダキンの近況、そしてニュートリノは一回置いておく。"
    links:
      listen: "https://listen.style/p/space-rock-diner/ep1"
