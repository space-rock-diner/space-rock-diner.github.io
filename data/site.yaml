# サイト全体の設定 — build.py が読む (エピソード一覧は episodes.yaml)
#
# mark_style: ヘッダーとお便りコーナーの絵の画風 (art/marks.py)
#   line    = モノライン (線 1 本で描く、静か)
#   sticker = レトロ・ステッカー (白フチと影のワッペン風)  ← 2026-09-14 所有者が選択
#   neon    = ネオンサイン (暗い地に光る管)
#   使わない 2 つも art/marks.py に残してあり、ここを書き換えれば切り替わる
#
# otayori: お便りコーナー。受け口は同じサイトの /api/otayori (functions/api/otayori.js → D1)。
#   宛先のメールアドレスはページに出さない (2026-09-14 所有者判断)
#   enabled:           true でフォームを使えるようにする。Cloudflare Pages で受け口が動くまで false
#                      (GitHub Pages には受け口が無いので、そちらで true にすると送信が失敗する)
#   turnstile_sitekey: Cloudflare Turnstile のサイトキー (公開してよい値)。秘密鍵は Pages の
#                      Variables and Secrets に TURNSTILE_SECRET として置き、ここには書かない

mark_style: sticker

otayori:
  enabled: false
  turnstile_sitekey: ""
